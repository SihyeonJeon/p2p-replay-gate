[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-replay-gate"
version = "0.3.0"
description = "Replay and policy-oracle evaluation for purchase-to-pay agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sihyeon Jeon" }]
keywords = ["agent-evaluation", "process-mining", "purchase-to-pay", "workflow-replay", "policy-oracle"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
p2p-replay-gate = "p2p_replay_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"p2p_replay_gate.mapping_packs" = ["*/*.json", "*/*.md"]
"p2p_replay_gate.mapping_packs.bpic2019" = ["*.json", "*.md"]
